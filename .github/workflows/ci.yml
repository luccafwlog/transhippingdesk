name: CI

permissions:
  contents: read

on:
  pull_request:
  push:
    branches:
      - main

# Um PR só precisa do resultado do commit mais recente. Runs antigos do mesmo
# ref são cancelados para liberar runners e encurtar a fila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Docs + Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Documentation
        run: npm run docs:check

      - name: Lint
        run: npm run lint

  build:
    name: Build + Bundle size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build (tsc + vite)
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Bundle size budget
        run: npm run size-limit

  test:
    name: Test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Test
        run: npm test -- --shard=${{ matrix.shard }}/3

  security-audit:
    name: Security guard replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify database security guards
        run: python scripts/security/verificar_guardas.py --ci

  # Gate único exigido pela proteção de branch: fica verde só quando todos os
  # jobs acima terminam verdes. Mantém um nome estável mesmo que os shards
  # mudem de quantidade.
  checks:
    name: checks
    runs-on: ubuntu-latest
    needs: [quality, build, test, security-audit]
    if: always()
    steps:
      - name: Verify all jobs succeeded
        run: |
          echo "quality: ${{ needs.quality.result }}"
          echo "build:   ${{ needs.build.result }}"
          echo "test:    ${{ needs.test.result }}"
          echo "security-audit: ${{ needs.security-audit.result }}"
          [ "${{ needs.quality.result }}" = "success" ] \
            && [ "${{ needs.build.result }}" = "success" ] \
            && [ "${{ needs.test.result }}" = "success" ] \
            && [ "${{ needs.security-audit.result }}" = "success" ]
