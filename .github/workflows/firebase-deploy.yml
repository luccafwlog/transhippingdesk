name: Deploy to Firebase Hosting

permissions:
  contents: read

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Firebase Hosting
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
          # O secret entra por env, não interpolado na linha de comando: o GitHub
          # substitui `${{ }}` antes do shell fazer o parsing, então uma aspa
          # simples dentro do JSON quebraria a citação do `echo`.
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_TRANSHIPPING_DESK }}
        run: |
          printf '%s' "$FIREBASE_SA" > /tmp/firebase-sa.json
          npx firebase-tools@15.22.4 deploy --only hosting:transhipping-desk \
            --project transhipping-desk \
            --non-interactive
