name: Deploy to Firebase Hosting

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Authenticate to Firebase
        env:
          FIREBASE_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_IMPORTMANAGER_BDA3E }}
        run: echo "$FIREBASE_SA" > /tmp/firebase-sa.json

      - name: Deploy to staging channel
        id: deploy
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          SHA7="${GITHUB_SHA:0:7}"
          CHANNEL="deploy-${SHA7}"
          npx firebase-tools@latest hosting:channel:deploy "$CHANNEL" \
            --project importmanager-bda3e \
            --expires 30m \
            --non-interactive
          echo "CHANNEL=$CHANNEL" >> "$GITHUB_ENV"

      - name: Release to live (atomic)
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-sa.json
        run: |
          npx firebase-tools@latest hosting:channel:release "$CHANNEL" \
            --to live \
            --project importmanager-bda3e \
            --non-interactive
