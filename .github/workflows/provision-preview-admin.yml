name: Provision Preview Admin

# Este workflow usa workflow_run de propósito: ele executa a versão do arquivo
# presente na branch padrão, nunca o YAML alterado pela PR. Assim, os secrets
# nunca ficam disponíveis para código fornecido por uma PR externa.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: preview-admin-${{ github.event.workflow_run.pull_requests[0].number || github.event.workflow_run.id }}
  cancel-in-progress: true

jobs:
  provision:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.pull_requests[0].head.repo.id == github.event.repository.id &&
      github.event.workflow_run.pull_requests[0].number
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_HEAD_REF: ${{ github.event.workflow_run.pull_requests[0].head.ref }}
      PR_HEAD_SHA: ${{ github.event.workflow_run.pull_requests[0].head.sha }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
      PREVIEW_ADMIN_EMAIL: qa-admin@example.test
      PREVIEW_ADMIN_FULL_NAME: Preview Admin
      PREVIEW_ADMIN_PASSWORD: ${{ secrets.PREVIEW_ADMIN_PASSWORD }}
    steps:
      # workflow_run executa no contexto padrão; explicitar a branch impede que
      # o script seja substituído pelo conteúdo não confiável da PR.
      - name: Checkout trusted provisioning code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.113.0

      - name: Wait for Supabase Preview
        shell: bash
        run: |
          set -euo pipefail
          : "${PR_HEAD_SHA:?PR_HEAD_SHA ausente}"
          for attempt in $(seq 1 36); do
            result="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${PR_HEAD_SHA}/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "Supabase Preview")] | if length == 0 then "missing" else (max_by(.completed_at // .started_at // .created_at) | .status + " " + (.conclusion // "")) end')"
            if [[ "$result" == "completed success" ]]; then
              exit 0
            fi
            if [[ "$result" == completed\ * ]]; then
              echo "Supabase Preview terminou com: $result"
              exit 1
            fi
            echo "Aguardando Supabase Preview ($attempt/36): ${result:-missing}"
            sleep 10
          done
          echo 'Tempo limite aguardando o check Supabase Preview.'
          exit 1

      - name: Load branch credentials
        # O `-o env` do CLI emite formato dotenv (`KEY="valor"`). O $GITHUB_ENV
        # espera `KEY=valor` cru e não remove aspas: anexar sem decodificar
        # deixava cada credencial com aspas literais e o provisionamento
        # quebrava em `Invalid supabaseUrl` (PR 652). O pipefail acima garante
        # que uma falha do CLI também reprova o step.
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?Configure o secret SUPABASE_ACCESS_TOKEN.}"
          : "${SUPABASE_PROJECT_REF:?Configure o secret SUPABASE_PROJECT_REF.}"
          : "${PR_HEAD_REF:?PR_HEAD_REF ausente}"
          supabase --experimental branches get "$PR_HEAD_REF" \
            --project-ref "$SUPABASE_PROJECT_REF" -o env | node scripts/load-branch-env.mjs

      - name: Provision test admin
        run: node scripts/provision-preview-admin.mjs
